name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04-arm
    container:
      image: clickable/arm64-ut24.04-1.x-arm64
    steps:
      - uses: actions/checkout@v7
      
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libdbus-1-dev patchelf libwayland-dev libegl1-mesa-dev wayland-protocols

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@v2.9.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build
        working-directory: app
        run: |
          npm ci
          npx tauri build
          chmod +x /__w/bitchat-ut/bitchat-ut/target/release/bundle/appimage/bitchat*.AppImage
          /__w/bitchat-ut/bitchat-ut/target/release/bundle/appimage/bitchat*.AppImage --appimage-extract
          tar cfvz squashfs-root.tar.gz squashfs-root
          ls -lah squashfs-root.tar.gz
          pwd


      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: squashfs-root 
          path: app/squashfs-root.tar.gz
          if-no-files-found: error
          archive: false
